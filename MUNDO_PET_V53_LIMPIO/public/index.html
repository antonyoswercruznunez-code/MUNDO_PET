<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Pet · Panel</title>
  <script>try{if(localStorage.getItem('mp_tema')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/css/sistema.css">
  <style>
    /* ══ SIDEBAR CELESTE CLARO ══════════════════════════════ */
    #sidebar {
    background: linear-gradient(
        180deg,
        #151A24 0%,
        #202938 55%,
        #111827 100%
    ) !important;

    border-right: 1px solid rgba(45, 212, 191, 0.25) !important;
}

    /* ── Zona logo: imagen limpia, sin fondo ni bordes ── */
    #sidebar .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 6px !important;
      min-height: unset !important;
      border-bottom: 1px solid rgba(14,165,233,.15) !important;
      background: rgba(14,165,233,.04);
    }
    #sidebar .brand-icon {
      width: 100% !important;
      height: auto !important;
      background: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      border: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sidebar .brand-icon img {
      width: calc(100% + 12px);
      max-width: 200px;
      height: auto;
      min-height: 150px;
      max-height: 170px;
      object-fit: cover;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      background: none !important;
      margin: -4px -6px;
    }
    #sidebar .brand-icon > i {
      font-size: 60px;
      color: #38BDF8;
      filter: drop-shadow(0 0 14px rgba(56,189,248,.45));
    }

    /* Colapsado */
    #sidebar.collapsed .sidebar-brand { padding: 8px 6px !important; }
    #sidebar.collapsed .brand-icon img {
      width: 42px; min-height: 42px; max-height: 42px;
      object-fit: contain; margin: 0;
    }
    #sidebar.collapsed .brand-icon > i { font-size: 26px; }

    /* ── Nav scroll suave ── */
    #sidebar { display: flex; flex-direction: column; }
    #sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 0 20px;
      max-height: calc(100vh - 180px);
      scrollbar-width: thin;
      scrollbar-color: rgba(56,189,248,.3) transparent;
    }
    #sidebar-nav::-webkit-scrollbar { width: 3px; }
    #sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    #sidebar-nav::-webkit-scrollbar-thumb {
      background: rgba(56,189,248,.35);
      border-radius: 3px;
    }

    /* ── Título de grupo ── */
    .nav-group-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: rgba(56,189,248,.6);
      padding: 13px 14px 4px 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-group-title::after {
      content: '';
      display: block;
      flex: 1;
      height: 1px;
      background: rgba(56,189,248,.15);
      margin-left: 4px;
    }
    #sidebar.collapsed .nav-group-title {
      padding: 8px 0 3px;
      justify-content: center;
    }
    #sidebar.collapsed .nav-group-title span { display: none; }
    #sidebar.collapsed .nav-group-title::after { display: none; }

    /* ── Items ── */
    #sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px 7px 11px;
      color: rgba(186,230,253,.7);
      border-left: 3px solid transparent;
      transition: all .16s;
      border-radius: 0 8px 8px 0;
      margin-right: 6px;
      font-size: 12.5px;
      text-decoration: none;
      cursor: pointer;
    }
    #sidebar .nav-item:hover {
      background: rgba(56,189,248,.12);
      color: #fff;
      border-left-color: #38BDF8;
    }
    #sidebar .nav-item.active {
      background: rgba(56,189,248,.18);
      color: #fff;
      border-left-color: #38BDF8;
      font-weight: 600;
    }
    #sidebar .nav-item .nav-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      color: rgba(56,189,248,.65);
      transition: color .16s;
    }
    #sidebar .nav-item:hover .nav-icon,
    #sidebar .nav-item.active .nav-icon { color: #38BDF8; }
    #sidebar .nav-item .nav-text {
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <a class="sidebar-brand" href="#">
      <div class="brand-icon" id="brand-icon">
        <i class="ti ti-paw"></i>
      </div>
    </a>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <header id="topbar">
    <div class="topbar-left">
      <button id="btn-toggle-sidebar"><i class="ti ti-menu-2"></i></button>
      <div class="topbar-breadcrumb"><strong id="breadcrumb-titulo">Dashboard</strong></div>
    </div>
    <div class="topbar-right">
      <button id="btn-tema" title="Cambiar tema"><i class="ti ti-moon"></i></button>
      <div class="topbar-avatar" id="topbar-avatar">A</div>
      <div style="line-height:1.3">
        <div class="topbar-nombre" id="topbar-nombre">Usuario</div>
        <div class="topbar-badge" id="topbar-perfil">Perfil</div>
      </div>
      <button id="btn-logout" style="margin-left:8px;display:flex;align-items:center;gap:5px">
        <i class="ti ti-logout"></i><span class="logout-txt">Salir</span>
      </button>
    </div>
  </header>

  <div id="sidebar-backdrop"></div>
  <main id="main"><div id="contenido"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script src="/assets/js/core/http.js?v=52.0.0"></script>
<script src="/assets/js/core/router.js?v=52.0.0"></script>
<script src="/assets/js/core/app.js?v=52.0.0"></script>
<script src="/assets/libs/xlsx.bundle.js"></script>

<script>
(function(){
  var KEY='mp_tema';
  function pintaIcono(){
    var osc=document.documentElement.getAttribute('data-tema')==='oscuro';
    var b=document.getElementById('btn-tema');
    if(b) b.innerHTML=osc?'<i class="ti ti-sun"></i>':'<i class="ti ti-moon"></i>';
  }
  document.addEventListener('click',function(e){
    if(e.target.closest&&e.target.closest('#btn-tema')){
      var osc=document.documentElement.getAttribute('data-tema')==='oscuro';
      if(osc){document.documentElement.removeAttribute('data-tema');try{localStorage.setItem(KEY,'claro');}catch(x){}}
      else{document.documentElement.setAttribute('data-tema','oscuro');try{localStorage.setItem(KEY,'oscuro');}catch(x){}}
      pintaIcono();return;
    }
    if(e.target.closest&&e.target.closest('#btn-toggle-sidebar')&&window.innerWidth<=768){
      var sb=document.getElementById('sidebar');
      if(sb)sb.classList.toggle('open');
      document.body.classList.toggle('sidebar-abierto',sb&&sb.classList.contains('open'));
      return;
    }
    if(window.innerWidth<=768&&e.target.closest&&
      (e.target.closest('#sidebar-backdrop')||e.target.closest('.nav-item'))){
      var sb=document.getElementById('sidebar');
      if(sb)sb.classList.remove('open');
      document.body.classList.remove('sidebar-abierto');
    }
  });
  fetch('/api/publico/logo').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok||!d.ruta)return;
    var bi=document.getElementById('brand-icon');
    if(bi) bi.innerHTML='<img src="'+d.ruta+'" alt="logo">';
  }).catch(function(){});
  document.addEventListener('DOMContentLoaded',pintaIcono);
  setTimeout(pintaIcono,300);
})();
</script>
</body>
</html>
