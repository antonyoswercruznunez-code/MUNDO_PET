<style>
  .pickup-hero{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:22px;background:linear-gradient(135deg,#effcf4,#f8fbff);border:1px solid #d9efe1;border-radius:16px;margin-bottom:16px}.pickup-hero h2{margin:0 0 5px}.pickup-hero p{margin:0;color:var(--text-muted)}
  .pickup-code-box{display:grid;grid-template-columns:minmax(230px,360px) auto 1fr;gap:10px;align-items:center}.pickup-code-box input{text-transform:uppercase;font-weight:700;letter-spacing:2px}.verified-code{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #bfe9ce;background:#f1fff6;border-radius:12px}.verified-code>i{font-size:24px;color:var(--success)}.verified-code div{display:flex;flex-direction:column}.verified-code small{color:var(--text-muted)}.code-error{display:flex;gap:7px;align-items:center;color:var(--danger);font-weight:600}.delivery-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.delivery-chip.pickup{background:#eef4ff;color:#3167be}.delivery-chip.delivery{background:#ecfbf2;color:#16844b}.action-cluster{display:flex;gap:5px;flex-wrap:wrap}.pickup-detail{text-align:left}.pickup-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}.pickup-detail-grid section{border:1px solid #e3e9f1;border-radius:11px;padding:12px;display:flex;flex-direction:column}.pickup-detail-grid span{font-size:11px;text-transform:uppercase;color:#728099}.pickup-detail-grid small{color:#728099;margin-top:3px}.pickup-address,.incident-note{display:flex;gap:10px;border-radius:11px;padding:12px;margin:12px 0;background:#f7f9fc}.pickup-address i{font-size:22px;color:var(--primary)}.pickup-address p,.incident-note p{margin:4px 0 0}.incident-note{display:block;background:#fff7ed;border:1px solid #fed7aa}.schedule-builder{display:grid;grid-template-columns:1.4fr 1.2fr 1fr 1fr .7fr auto;gap:10px;align-items:end}.schedule-builder label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#526079}@media(max-width:950px){.pickup-code-box,.schedule-builder{grid-template-columns:1fr 1fr}.pickup-code-box #rc-codigo-info{grid-column:1/-1}.pickup-detail-grid{grid-template-columns:1fr}}@media(max-width:620px){.pickup-code-box,.schedule-builder{grid-template-columns:1fr}.pickup-hero{align-items:flex-start;flex-direction:column}}
</style>
<div class="pickup-hero"><div><h2><i class="ti ti-map-pin"></i> Preparación, recojo y delivery</h2></div></div>
<div class="pickup-tabs" role="tablist"><button id="rc-tab-orders" class="pickup-tab active" type="button"><i class="ti ti-packages"></i> Pedidos y entregas <span id="rc-orders-count">0</span></button><button id="rc-tab-schedules" class="pickup-tab" type="button"><i class="ti ti-calendar-time"></i> Horarios de recojo</button></div>
<div id="rc-panel-orders" class="pickup-panel active">
<div class="card" style="margin-bottom:16px"><div class="tabla-toolbar pickup-code-box"><input id="rc-codigo" class="form-control" maxlength="9" placeholder="AB12-CD34" autocomplete="off"><button id="rc-verificar" class="btn btn-primary"><i class="ti ti-scan"></i> Verificar código</button><div id="rc-codigo-info"></div></div></div>
<div class="card"><div class="tabla-toolbar"><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="rc-estado" class="form-control"><option value="">Todos los estados</option><option value="pendiente">Pendiente</option><option value="preparando">Preparando</option><option value="listo">Listo</option><option value="en_ruta">En ruta</option><option value="incidencia">Con incidencia</option><option value="entregado">Entregado</option></select><select id="rc-tipo" class="form-control"><option value="">Recojo y delivery</option><option value="recojo">Recojo en tienda</option><option value="delivery">Delivery</option></select><input id="rc-buscar" class="form-control" placeholder="Pedido, nota o cliente"></div><button id="rc-refrescar" class="btn btn-outline"><i class="ti ti-refresh"></i> Actualizar</button></div><div class="tabla-container"><table class="tabla"><thead><tr><th>Pedido / Nota</th><th>Cliente</th><th>Sucursal</th><th>Entrega</th><th>Estado</th><th>Programación</th><th>Acciones</th></tr></thead><tbody id="rc-tbody"></tbody></table></div></div>
</div>
<div id="rc-panel-schedules" class="pickup-panel">
<div class="card" id="rc-horarios-card" style="margin-top:16px"><div class="card-header"><div><h3><i class="ti ti-calendar-time"></i> Horarios de recojo</h3></div></div><div class="tabla-toolbar schedule-builder"><label>Sucursal<select id="rc-h-sucursal" class="form-control"></select></label><label>Fecha<input id="rc-h-fecha" type="date" class="form-control"></label><label>Hora inicial<input id="rc-h-inicio" type="time" class="form-control" value="09:00"></label><label>Hora final<input id="rc-h-fin" type="time" class="form-control" value="11:00"></label><label>Cupos<input id="rc-h-cupos" type="number" min="1" max="500" value="10" class="form-control"></label><div style="display:flex;gap:7px"><button id="rc-h-semana" class="btn btn-outline"><i class="ti ti-calendar-week"></i> Crear semana</button><button id="rc-h-crear" class="btn btn-primary"><i class="ti ti-plus"></i> Crear horario</button></div></div>
<div class="schedule-filters">
  <label>Filtrar sucursal<select id="rc-h-filter-sucursal" class="form-control"><option value="">Todas</option></select></label>
  <label>Desde<input id="rc-h-filter-desde" type="date" class="form-control"></label>
  <label>Estado<select id="rc-h-filter-estado" class="form-control"><option value="">Todos</option><option value="0">Activos</option><option value="1">Inactivos</option></select></label>
  <label>Buscar<input id="rc-h-filter-buscar" class="form-control" placeholder="Fecha u horario"></label>
  <button id="rc-h-filter-clear" class="btn btn-outline" type="button"><i class="ti ti-filter-off"></i> Limpiar</button>
</div>
<div class="tabla-container"><table class="tabla"><thead><tr><th>Sucursal</th><th>Fecha</th><th>Horario</th><th>Cupos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rc-h-tbody"></tbody></table></div></div>
</div>
<style>
.pickup-flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:10px;background:#f8fafc;border-radius:12px}.pickup-flow span{padding:7px 10px;border-radius:999px;background:#e2e8f0;color:#64748b;font-size:10px;font-weight:900}.pickup-flow span.active{background:#16a34a;color:#fff}.pickup-detail-pro .pickup-detail-grid section{border:1px solid #dbe7df;box-shadow:0 5px 14px rgba(15,23,42,.04)}.pickup-detail-pro .pickup-address{background:linear-gradient(135deg,#f0fdf4,#fff);border:1px solid #bbf7d0}.action-cluster{display:flex;gap:6px;flex-wrap:wrap;min-width:210px}.pickup-tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.pickup-tab{border:1px solid #dbe5df;background:#fff;color:#405168;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(15,23,42,.04)}.pickup-tab.active{background:#16a34a;color:#fff;border-color:#16a34a}.pickup-tab span{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#edf2f7;color:#334155;font-size:11px}.pickup-tab.active span{background:rgba(255,255,255,.2);color:#fff}.pickup-panel{display:none}.pickup-panel.active{display:block}.schedule-filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr auto;gap:10px;align-items:end;padding:14px 18px;background:#f8fafc;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}.schedule-filters label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:800;color:#526079}.verified-code .btn{margin-left:auto}@media(max-width:900px){.schedule-filters{grid-template-columns:1fr 1fr}.schedule-filters button{align-self:end}}@media(max-width:620px){.schedule-filters{grid-template-columns:1fr}.pickup-tab{flex:1;justify-content:center}}
</style>
