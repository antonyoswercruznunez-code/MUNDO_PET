<style>

<div class="page-header"><div class="page-header-left"><h2><i class="ti ti-gift"></i> Temporadas y descuentos</h2><p>Publica campañas con descuentos por producto, en porcentaje o en soles.</p></div><button id="tm-nueva" class="btn btn-primary"><i class="ti ti-plus"></i> Nueva temporada</button></div>
