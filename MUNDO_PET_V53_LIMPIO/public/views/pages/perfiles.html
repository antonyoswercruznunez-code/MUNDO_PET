<div class="page-header">
  <div class="page-header-left">
    <h2><i class="ti ti-shield-check"></i> Gestión de Perfiles</h2>
  </div>
  <div id="slot-btn-nuevo-perfil"></div>
</div>

<div class="card">
  <div class="tabla-toolbar">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:13px;color:var(--texto-muted)">Mostrar</span>
      <select class="form-control" id="sel-limite" style="width:70px;padding:5px 8px">
        <option>10</option><option>25</option><option>50</option>
      </select>
      <span style="font-size:13px;color:var(--texto-muted)">registros</span>
    </div>
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="inp-buscar" placeholder="Buscar perfil...">
    </div>
  </div>

  <div class="tabla-container">
    <table class="tabla">
      <thead>
        <tr>
          <th>Perfil</th>
          <th>Descripción</th>
          <th>Módulos</th>
          <th>Usuarios asignados</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tbody-perfiles">
        <tr><td colspan="6">
          <div class="loading-center">
            <div class="spinner spinner-lg"></div>
          </div>
        </td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <div class="pagination-info" id="pag-info"></div>
    <div class="pagination-btns" id="pag-btns"></div>
  </div>
</div>

<!-- MODAL PERFIL -->
<div class="modal-overlay" id="modal-perfil">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <i class="ti ti-shield-plus"></i>
        <span id="modal-perfil-titulo">Nuevo Perfil</span>
      </div>
      <button class="modal-close" id="btn-cerrar-perfil">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="prf-id">
      <div class="form-group">
        <label class="form-label">Nombre *</label>
        <input type="text" class="form-control" id="prf-nombre"
               placeholder="Nuevo Perfil" maxlength="40">
        <div class="campo-error" id="err-prf-nombre"
             style="display:none;font-size:11px;color:var(--danger);margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" id="prf-descripcion"
                  rows="2" placeholder="Descripción opcional"></textarea>
      </div>
      <div class="form-group" id="grupo-estado-prf" style="display:none">
        <label class="form-label">Estado</label>
        <select class="form-control" id="prf-estado">
          <option value="0">Activo</option>
          <option value="1">Inactivo</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btn-cancelar-perfil">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-perfil">
        <i class="ti ti-check"></i> Guardar
      </button>
    </div>
  </div>
</div>

<!-- MODAL PERMISOS -->
<div class="modal-overlay" id="modal-permisos">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">
        <i class="ti ti-lock"></i>
        <span id="permisos-titulo">Permisos</span>
      </div>
      <button class="modal-close" id="btn-cerrar-permisos">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="modal-body">
      <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px">
        <button class="btn btn-outline btn-sm" onclick="_marcarTodos(true)">
          Todos
        </button>
        <button class="btn btn-outline btn-sm" onclick="_marcarTodos(false)">
          Ninguno
        </button>
      </div>
      <h4 style="margin:0 0 8px;color:var(--texto-fuerte)">Módulos visibles</h4>
      <div id="lista-opciones-modal"
           style="display:grid;grid-template-columns:1fr 1fr;gap:4px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btn-cancelar-permisos">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-permisos">
        <i class="ti ti-check"></i> Guardar permisos
      </button>
    </div>
  </div>
</div>
