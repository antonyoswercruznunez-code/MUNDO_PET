<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803d">
  <title>Sin conexión · Mundo Pet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f7f8; color: #111827; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; text-align: center; }
    .card { max-width: 380px; background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 32px 26px; box-shadow: 0 20px 50px -24px rgba(17, 24, 39, .35); }
    img { width: 84px; height: 84px; border-radius: 18px; }
    h1 { margin: 16px 0 6px; font-size: 21px; }
    p { color: #4b5563; font-size: 15px; line-height: 1.5; }
    button { margin-top: 20px; height: 46px; padding: 0 22px; border: 0; border-radius: 12px; background: #15803d; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/img/app/icon-192.png" alt="Mundo Pet">
    <h1>Sin conexión</h1>
    <p>Revisa tu internet o tus datos móviles. Cuando vuelva la señal, toca reintentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
